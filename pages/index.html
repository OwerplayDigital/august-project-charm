<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d">
<title>OWERPLAY — Controle de créditos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07111d;color:#eaf7ff}body{min-height:100vh;padding:22px 17px 28px;background-image:radial-gradient(circle at 12% 0%,rgba(20,184,230,.20),transparent 30%),radial-gradient(circle at 100% 28%,rgba(255,154,53,.14),transparent 28%),linear-gradient(rgba(70,217,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(70,217,255,.035) 1px,transparent 1px);background-size:auto,auto,30px 30px,30px 30px}.wrap{max-width:430px;margin:auto}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.head img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}.head strong{font-size:18px}.glass{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.055);padding:11px;border-radius:27px;box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.14);backdrop-filter:blur(18px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;min-height:178px;overflow:hidden;border-radius:21px;padding:16px;color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.27)}.uni{background:linear-gradient(145deg,#075ec9,#0a9ed8 52%,#19c6d4)}.goat{background:linear-gradient(145deg,#d94b08,#f57612 50%,#ffb32f)}.tag{font-size:8px;text-transform:uppercase;letter-spacing:.22em;opacity:.75}.name{font-size:15px;font-weight:800;margin-top:4px}.value{margin-top:39px;font-size:63px;font-weight:900;line-height:.95;letter-spacing:-.05em}.sub{margin-top:8px;font-size:10px;opacity:.8}.fund{position:relative;margin-top:11px;overflow:hidden;border-radius:22px;border:1px solid rgba(157,255,226,.29);padding:21px;background:linear-gradient(140deg,#075d4a,#07946c 48%,#18c58e);box-shadow:inset 0 1px rgba(255,255,255,.22)}.fundtop{display:flex;justify-content:space-between;gap:8px}.fundtop strong{font-size:15px}.label{display:block;margin-top:4px;font-size:8px;text-transform:uppercase;letter-spacing:.18em;opacity:.7}.pill{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);border-radius:999px;padding:7px 9px;font-size:8px;letter-spacing:.12em;height:max-content}.money{margin:27px 0 17px;font-size:58px;font-weight:900;line-height:1;letter-spacing:-.05em}.bar{height:7px;border-radius:999px;background:rgba(0,45,36,.4);overflow:hidden;border:1px solid rgba(255,255,255,.1)}.bar span{display:block;height:100%;width:8%;background:linear-gradient(90deg,#a6ffe1,#fff)}.meta{display:flex;justify-content:space-between;margin-top:9px;font-size:9px;opacity:.8}footer{text-align:center;margin-top:14px;font-size:8px;text-transform:uppercase;letter-spacing:.2em;color:#536b7d}
</style></head>
<body><main class="wrap"><header class="head"><img src="owerplay-logo.png" alt="OwerPlay TV Online"><strong>Controle de créditos</strong></header><section class="glass"><div class="grid"><article class="card uni"><div class="tag">Servidor 01</div><div class="name">UNIPLAY</div><div class="value">66</div><div class="sub">créditos disponíveis</div></article><article class="card goat"><div class="tag">Servidor 02</div><div class="name">GOAT</div><div class="value">8</div><div class="sub">créditos disponíveis</div></article></div><section class="fund"><div class="fundtop"><div><strong>Caixinha de reposição</strong><span class="label">Reserva operacional</span></div><span class="pill">EM DIA</span></div><div class="money">R$ 50,00</div><div class="bar"><span></span></div><div class="meta"><span>Acumulado atual</span><span>Meta R$ 375</span></div></section></section><footer>OwerPlay • controle inteligente</footer></main></body></html>
